name: Build Fabric 1.21.1

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/wrapper-validation-action@v2
      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
      - run: chmod +x ./gradlew
      - name: Build Fabric 1.21.1
        run: ./gradlew buildAndCollect+fabric+1.21.1 -Pci_loader=fabric
      - name: Upload Fabric 1.21.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: collisionfix-fabric-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
